name: Hello DevOps
 
on:
  push:
    branches:
      - main
 
jobs:
  say-hello:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
 
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'
 
      - name: Run Hello World app
        run: python app.py
 
      - name: Echo Hello DevOps
        run: echo "Hello DevOps"
